<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" fill="currentColor" />
          </svg>
        </div>
        <div>
          <div class="brand-name">Medical Assistant</div>
          <div class="status"><span class="status-dot"></span>Local model · Llama 2</div>
        </div>
      </div>
      <button class="ghost-btn" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
        </svg>
        New chat
      </button>
    </header>

    <!-- Conversation -->
    <main class="thread" id="thread">
      <div class="thread-inner">

        <section class="welcome" id="welcome">
          <h1>What would you like to know?</h1>
          <p>I answer from your medical documents and show the pages I used, so you can check for yourself.</p>

          <div class="suggestions">
            <button class="suggestion" type="button" data-q="What are the common symptoms of malaria?">
              <span class="suggestion-title">Malaria symptoms</span>
              <span class="suggestion-sub">What are the common signs?</span>
            </button>
            <button class="suggestion" type="button" data-q="What is the difference between type 1 and type 2 diabetes?">
              <span class="suggestion-title">Diabetes types</span>
              <span class="suggestion-sub">Type 1 vs type 2</span>
            </button>
            <button class="suggestion" type="button" data-q="What causes high blood pressure?">
              <span class="suggestion-title">Hypertension</span>
              <span class="suggestion-sub">What causes it?</span>
            </button>
            <button class="suggestion" type="button" data-q="How is typhoid fever treated?">
              <span class="suggestion-title">Typhoid treatment</span>
              <span class="suggestion-sub">How is it managed?</span>
            </button>
          </div>
        </section>

        <div class="messages" id="messages" aria-live="polite"></div>
      </div>
    </main>

    <!-- Input -->
    <footer class="composer-wrap">
      <form class="composer" id="composer">
        <textarea
          id="msg"
          rows="1"
          placeholder="Ask a medical question..."
          aria-label="Your question"
        ></textarea>
        <button class="send-btn" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </button>
      </form>
      <p class="hint">
        <kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line ·
        For information only, not a substitute for a doctor.
      </p>
    </footer>
  </div>

  <script>
    const thread = document.getElementById("thread");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("composer");
    const input = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    let busy = false;

    // ----------
